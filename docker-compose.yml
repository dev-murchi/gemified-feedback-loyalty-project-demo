name: feedback-loyalty

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback}
      POSTGRES_DB: ${POSTGRES_DB:-feedback}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-feedback}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    # BullMQ requires noeviction (SDD ADR-011).
    command:
      [
        'redis-server',
        '--maxmemory-policy',
        'noeviction',
        '--appendonly',
        'yes',
      ]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # API contract mock (S0-02). Start with: docker compose --profile mock up -d mock
  mock:
    image: stoplight/prism:5.15.10
    platform: linux/amd64 # the image is published for amd64 only
    profiles: ['mock']
    # -m false: Prism 5.15.10 crashes in multiprocess mode ("reading 'isPrimary'").
    command:
      [
        'mock',
        '-m',
        'false',
        '-h',
        '0.0.0.0',
        '-p',
        '4010',
        '/contract/openapi.yaml',
      ]
    volumes:
      - ./docs/api:/contract:ro
    ports:
      - '4010:4010'

volumes:
  pgdata:
